<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="img/icon.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Bankist | Client Dashboard</title>
  </head>
  <body class="app-page">
    <nav class="nav nav--app">
      <a href="index.html" aria-label="Back to Bankist home">
        <img src="img/logo.png" alt="Bankist logo" class="nav__logo" />
      </a>
      <div class="client-session">
        <span class="client-session__welcome">Welcome back</span>
        <button class="client-session__logout" type="button">Log out</button>
      </div>
    </nav>

    <main class="app-main">
      <section class="section section--client" id="section--client">
        <div class="section__title">
          <h2 class="section__description">Client dashboard</h2>
          <h3 class="section__header">
            Move money, request loans, and track your balance in one place.
          </h3>
        </div>

        <div class="bankapp">
          <div class="bankapp__balance">
            <div>
              <p class="bankapp__balance-label">Current balance</p>
              <p class="bankapp__balance-date">
                As of <span class="bankapp__date">Today</span>
              </p>
            </div>
            <p class="bankapp__balance-value">0.00 EUR</p>
          </div>

          <div class="bankapp__layout">
            <div
              class="bankapp__movements"
              aria-label="Account movements"
            ></div>

            <div class="bankapp__operation bankapp__operation--transfer">
              <h4 class="bankapp__operation-title">Transfer money</h4>
              <form class="bankapp__form bankapp__form--transfer">
                <input
                  type="text"
                  class="bankapp__input bankapp__input--to"
                  autocomplete="off"
                />
                <input
                  type="number"
                  class="bankapp__input bankapp__input--amount"
                  min="0"
                  step="0.01"
                />
                <button
                  class="bankapp__form-btn bankapp__form-btn--transfer"
                  type="submit"
                  aria-label="Send transfer"
                >
                  &rarr;
                </button>
                <label class="bankapp__form-label">Transfer to</label>
                <label class="bankapp__form-label">Amount</label>
              </form>
              <p
                class="bankapp__message bankapp__message--transfer"
                aria-live="polite"
              ></p>
            </div>

            <div class="bankapp__operation bankapp__operation--loan">
              <h4 class="bankapp__operation-title">Request loan</h4>
              <form class="bankapp__form bankapp__form--loan">
                <input
                  type="number"
                  class="bankapp__input bankapp__input--loan-amount"
                  min="0"
                  step="1"
                />
                <button
                  class="bankapp__form-btn bankapp__form-btn--loan"
                  type="submit"
                  aria-label="Request loan"
                >
                  &rarr;
                </button>
                <label class="bankapp__form-label bankapp__form-label--loan">
                  Amount
                </label>
              </form>
              <p
                class="bankapp__message bankapp__message--loan"
                aria-live="polite"
              ></p>
            </div>

            <div class="bankapp__operation bankapp__operation--close">
              <h4 class="bankapp__operation-title">Close account</h4>
              <form class="bankapp__form bankapp__form--close">
                <input
                  type="text"
                  class="bankapp__input bankapp__input--close-user"
                  autocomplete="off"
                />
                <input
                  type="password"
                  maxlength="4"
                  inputmode="numeric"
                  class="bankapp__input bankapp__input--close-pin"
                />
                <button
                  class="bankapp__form-btn bankapp__form-btn--close"
                  type="submit"
                  aria-label="Close account"
                >
                  &rarr;
                </button>
                <label class="bankapp__form-label">Confirm user</label>
                <label class="bankapp__form-label">Confirm PIN</label>
              </form>
              <p
                class="bankapp__message bankapp__message--close"
                aria-live="polite"
              ></p>
            </div>
          </div>

          <div class="bankapp__summary">
            <p class="bankapp__summary-label">In</p>
            <p class="bankapp__summary-value bankapp__summary-value--in">
              0.00 EUR
            </p>
            <p class="bankapp__summary-label">Out</p>
            <p class="bankapp__summary-value bankapp__summary-value--out">
              0.00 EUR
            </p>
            <p class="bankapp__summary-label">Interest</p>
            <p class="bankapp__summary-value bankapp__summary-value--interest">
              0.00 EUR
            </p>
            <button class="bankapp__sort" type="button">&downarrow; Sort</button>
            <p class="bankapp__timer">
              You will be logged out in
              <span class="bankapp__timer-value">05:00</span>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="bank-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
